<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            font-size: 72px;
            font-weight: lighter;
            background-color: rgb(0, 0, 0);

            border: solid 5px rgb(63, 0, 0);

            color: rgb(127, 140, 141);

            border-radius: 5px;
            text-align: center;
        }

        h4 {
            text-shadow:
                0 0 5px #ff0000,
                0 0 10px #33ff00,
                0 0 20px #d9ff00,
                0 0 40px #003cff,
                0 0 80px #00ffb3;
            font-size: 32px;
            color: #003cff;
            border: solid 10px rgb(0, 0, 0);
            ;

        }

        img {
            width: 1000px;

        }

        /* CSS cho nút */
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            background: linear-gradient(45deg, #000000, #ea00ff);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            transition: 0.3s ease;
        }

        a:hover {
            background: linear-gradient(45deg, #ffffff, #000000);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            transform: scale(1.1);

        }

        video {
            width: 400px;
        }
    </style>
</head>

<body>

</body>
