<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màu nhấp nháy</title>
    <style>
        .blink-text {
            font-size: 60px;
            font-weight: bold;
            text-align: center;
            animation: blinkColor 1s infinite;
        }

        @keyframes blinkColor {
            0%   { color: rgb(49, 7, 7); }
            25%  { color: rgb(78, 78, 131); }
            50%  { color: green; }
            75%  { color: rgb(201, 149, 53); }
            100% { color: black; }
        }
    </style>
</head>
<body>

    <p class="blink-text">Tôinhap nahy</p>

</body>
</html>
