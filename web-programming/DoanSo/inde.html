<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=0, initial-scale=1.0">
    <title>hi</title>
</head>
<body>
    <h1>cho xin tên </h1>
    <input type="text" id="ten" placeholder="nhap ten vao:">
    <button onclick="chao()">send</button>
    <div id="ketqua"></div>


    <script>
        function chao() {
            let ten = document.getElementById("ten").value;
            document.getElementById("ketqua").innerText = "xin chào " + ten 
            document.getElementById("ten").value = "";
        }
    </script>
</body>
</html>
