<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #4f46e5;
            color: white;
        }

        button {
            padding: 10px 15px;
            margin: 10px 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Quản Lý Đơn Hàng</h1>

    <button onclick="xoaTatCa()">
        Xóa tất cả đơn hàng
    </button>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Họ tên</th>
                <th>SĐT</th>
                <th>Địa chỉ</th>
                <th>Số lượng</th>
                <th>Thời gian</th>
            </tr>
        </thead>

        <tbody id="data">

        </tbody>
        <a class="button" href="index.html">Back to home page</a>
    </table>

    <script>
        function taiDonHang() {

            let ds = JSON.parse(localStorage.getItem("donhang")) || [];

            let html = "";

            ds.forEach((dh, index) => {

                html += `
        <tr>
            <td>${index + 1}</td>
            <td>${dh.ten}</td>
            <td>${dh.sdt}</td>
            <td>${dh.diachi}</td>
            <td>${dh.soluong}</td>
            <td>${dh.thoigian}</td>
        </tr>
        `;
            });

            document.getElementById("data").innerHTML = html;
        }

        function xoaTatCa() {
            if (confirm("Xóa toàn bộ đơn hàng?")) {
                localStorage.removeItem("donhang");
                taiDonHang();
            }
        }

        taiDonHang();
    </script>

</body>

</html>
